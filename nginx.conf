events {}
http {
    # Re-resolve DNS every 30s so upstream IP changes don't cause timeouts
    resolver 8.8.8.8 8.8.4.4 valid=30s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80 default backlog=16384;
        listen [::]:80 default backlog=16384;

        set $cdn_upstream https://cdn.mxpnl.com;
        set $api_upstream https://api-eu.mixpanel.com;

        # CDN assets (JS SDK and all async modules)
        location /libs/ {
            proxy_ssl_server_name on;
            proxy_set_header Host cdn.mxpnl.com;
            proxy_pass $cdn_upstream/libs/;
        }

        # Tracking endpoints → api-eu.mixpanel.com
        location / {
            proxy_set_header Host api-eu.mixpanel.com;
            proxy_set_header X-Real-IP $http_x_forwarded_for;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_ssl_server_name on;
            proxy_pass $api_upstream/;
        }
    }
}